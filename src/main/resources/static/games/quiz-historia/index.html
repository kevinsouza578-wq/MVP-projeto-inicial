<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Historia</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="game-root">
  <section class="panel">
    <p class="eyebrow">Placeholder jogavel</p>
    <h1>Quiz Historia</h1>
    <p id="question" class="question"></p>
    <div id="answers" class="answers"></div>
    <p id="feedback" class="feedback"></p>
    <div class="footer">
      <span id="progress"></span>
      <button id="nextButton" type="button" class="hidden">Proxima</button>
    </div>
  </section>
</main>
<script src="/js/game-sdk.js"></script>
<script src="./script.js"></script>
</body>
</html>
