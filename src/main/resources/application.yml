server:
  port: 8080

spring:
  application:
    name: educagames
  datasource:
    url: jdbc:h2:mem:educagames;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  jwt:
    secret: change-this-development-secret-key-with-at-least-32-characters
    expiration-ms: 86400000
